name: rahbar

services:
  chroma:
    image: chromadb/chroma:1.0.12
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/chroma/chroma
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/api/v2/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-models:
    image: ollama/ollama:0.12.6
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull nomic-embed-text && ollama pull llama3.2:3b"]
    restart: "no"

  indexer:
    build:
      context: .
      dockerfile: indexer/Dockerfile
    depends_on:
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
    environment: &rahbar-config
      EMBED_MODEL: nomic-embed-text
      EMBED_DIMENSION: "768"
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION: rahbar
      OLLAMA_URL: http://ollama:11434
      CORPUS_DIR: /corpus
      REDIS_URL: redis://redis:6379/0
      CHUNK_SIZE: "400"
      CHUNK_OVERLAP: "50"
    restart: "no"

  api:
    build:
      context: api
    depends_on:
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
      indexer:
        condition: service_completed_successfully
    environment:
      <<: *rahbar-config
      RETRIEVER: chroma
      LLM_PROVIDER: ollama-host
      LLM_MODEL: llama3.2:3b
      SERVE_UI_DIR: ""
    ports:
      - "8000:8000"

  ui:
    build:
      context: ui
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  chroma-data:
  redis-data:
  ollama-data:
