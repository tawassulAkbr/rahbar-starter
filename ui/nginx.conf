# nginx for the ui Deployment. Replaces /etc/nginx/nginx.conf in your image.
#
# Built to run as a non-root user with readOnlyRootFilesystem: true (section 4.7).
# - It listens on 8081, because a non-root process cannot bind ports below 1024.
# - Everything nginx writes (pid, temp files) goes under /tmp, so mount an
#   emptyDir volume at /tmp in your Deployment.
# - Logs go to stdout and stderr (section 4.8).
#
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8081;
        root /usr/share/nginx/html;

        # Compose and Kubernetes both expose the API as the `api` service. Keeping
        # this proxy in the UI makes the live stack work from one browser origin.
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # For the ui container's own probes.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
