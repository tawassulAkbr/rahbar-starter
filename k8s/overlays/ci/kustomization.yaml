apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - ../../base
  - embedding-stub.yaml
patches:
  - path: config-patch.yaml
  - path: indexer-job-patch.yaml
  - path: redis-ci-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: redis
images:
  - name: rahbar-api
    newName: rahbar-api
    newTag: ci
  - name: rahbar-indexer
    newName: rahbar-indexer
    newTag: ci
  - name: rahbar-ui
    newName: rahbar-ui
    newTag: ci
