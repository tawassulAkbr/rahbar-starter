apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - ../../base
  - ollama.yaml
patches:
  - path: prod-config.yaml
images:
  - name: rahbar-api
    newName: rahbar-api
    newTag: prod
  - name: rahbar-indexer
    newName: rahbar-indexer
    newTag: prod
  - name: rahbar-ui
    newName: rahbar-ui
    newTag: prod
