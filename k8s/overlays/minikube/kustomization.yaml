apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - ../prod
images:
  - name: rahbar-api
    newTag: assignment03
  - name: rahbar-indexer
    newTag: a03-20261126
  - name: rahbar-ui
    newTag: assignment03
replicas:
  - name: api
    count: 1
  - name: ui
    count: 1
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
