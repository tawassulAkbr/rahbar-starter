apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: indexer
        spec:
          serviceAccountName: rahbar-indexer
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            fsGroup: 10002
          initContainers:
            - name: seed-data-lake
              image: rahbar-indexer:dev
              command: ["python", "/app/seed_corpus.py"]
              envFrom:
                - configMapRef:
                    name: rahbar-config
              volumeMounts:
                - name: data-lake
                  mountPath: /data
          containers:
            - name: indexer
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "pipeline.run"]
              envFrom:
                - configMapRef:
                    name: rahbar-config
              volumeMounts:
                - name: data-lake
                  mountPath: /data
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1
                  memory: 2Gi
          volumes:
            - name: data-lake
              persistentVolumeClaim:
                claimName: rahbar-data-lake
