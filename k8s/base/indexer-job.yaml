apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-job
  namespace: rahbar
  labels:
    app: indexer
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: indexer
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        fsGroup: 10002
      automountServiceAccountToken: false
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "pipeline.run", "--dummy"]
          envFrom:
            - configMapRef:
                name: rahbar-config
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
