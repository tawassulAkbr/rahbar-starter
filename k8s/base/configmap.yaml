apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  EMBED_MODEL: dummy-768
  EMBED_DIMENSION: "768"
  TOP_K: "5"
  CHUNK_SIZE: "250"
  CHUNK_OVERLAP: "40"
  RETRIEVER: stub
  LLM_PROVIDER: stub
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: rahbar
  TEMPERATURE: "0.2"
  RELEVANCE_FLOOR: "0.6"
  CACHE_THRESHOLD: "0.92"
  OLLAMA_URL: http://host.minikube.internal:11434
  REDIS_URL: redis://redis:6379/0
  REDIS_INVALIDATION_CHANNEL: rahbar:index-updated
  CORPUS_DIR: /corpus
