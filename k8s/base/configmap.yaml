apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  EMBED_MODEL: dummy-768
  EMBED_DIMENSION: "768"
  TOP_K: "5"
  CHUNK_SIZE: "250"
  CHUNK_OVERLAP: "40"
  RETRIEVER: stub
  LLM_PROVIDER: stub
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: rahbar
  TEMPERATURE: "0.2"
  RELEVANCE_FLOOR: "0.6"
  CACHE_THRESHOLD: "0.92"
  OLLAMA_URL: http://host.minikube.internal:11434
  REDIS_URL: redis://redis:6379/0
  REDIS_INVALIDATION_CHANNEL: rahbar:index-updated
  CORPUS_DIR: /data/corpus
  # RAGOps settings are strings because ConfigMap data is string-valued.
  QUARANTINE_DIR: /data/quarantine
  ARCHIVE_DIR: /data/archive
  VERIFY_ENABLED: "true"
  GATE_RECALL5_MAX_DROP: "0.05"
  GATE_FAITHFULNESS_MIN: "0.90"
  GATE_P95_MAX_MS: "180000"
  GATE_ABSTENTION_MIN: "1.0"
  GATE_CITATION_MIN: "0.95"
  EVAL_ALLOW_STUB: "false"
  COVERAGE_THRESHOLD: "0.85"
  TRACE_DIR: /data/traces
  EMBED_MODEL_VERSION: unknown
  VERIFY_REPORT_DIR: /data/reports
  INDEX_STATE_FILE: /data/index-state.json
  CANDIDATE_COLLECTION: rahbar-candidate
  CANDIDATE_TOP_K: "4"
