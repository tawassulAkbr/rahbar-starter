name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RETRIEVER: stub
      LLM_PROVIDER: stub
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            indexer/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r indexer/requirements.txt
          python -m pip install -r api/requirements.txt
          python -m pip install -r requirements-dev.txt
      - run: pytest api/tests/ indexer/tests/ --cov=app --cov=pipeline --cov-report=term-missing --cov-fail-under=60
      - run: ruff check .
      - run: python -m compileall -q api indexer corpus

  build-push:
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.10.0
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish API image
        uses: docker/build-push-action@v6.15.0
        with:
          context: api
          platforms: linux/amd64
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/rahbar-api:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || format('rahbar-api:{0}', github.sha) }}
      - name: Build and publish indexer image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: indexer/Dockerfile
          platforms: linux/amd64
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/rahbar-indexer:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || format('rahbar-indexer:{0}', github.sha) }}
      - name: Build and publish UI image
        uses: docker/build-push-action@v6.15.0
        with:
          context: ui
          platforms: linux/amd64
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/rahbar-ui:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || format('rahbar-ui:{0}', github.sha) }}

  deploy:
    needs: [build-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: azure/setup-kubectl@v4.0.0
        with:
          version: v1.31.4
      - name: Deploy to external cluster if STAGING_KUBECONFIG is set
        if: ${{ secrets.STAGING_KUBECONFIG != '' }}
        env:
          KUBECONFIG_DATA: ${{ secrets.STAGING_KUBECONFIG }}
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          SHA: ${{ github.sha }}
          STAGING_INGRESS_URL: ${{ secrets.STAGING_INGRESS_URL }}
        run: |
          printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          if [ -n "$REGISTRY_USER" ]; then
            kubectl set image deployment/api api="$REGISTRY_USER/rahbar-api:$SHA" -n rahbar
            kubectl set image deployment/ui ui="$REGISTRY_USER/rahbar-ui:$SHA" -n rahbar
            kubectl set image cronjob/reindex indexer="$REGISTRY_USER/rahbar-indexer:$SHA" -n rahbar
          fi
          kubectl rollout status deployment/api -n rahbar --timeout=120s
          kubectl rollout status deployment/ui -n rahbar --timeout=120s
          if [ -n "$STAGING_INGRESS_URL" ]; then
            kubectl get ingress -n rahbar
            curl --fail --silent --show-error "$STAGING_INGRESS_URL/healthz"
            curl --fail --silent --show-error "$STAGING_INGRESS_URL/readyz"
          fi
      - name: Deploy to ephemeral Kind cluster
        if: ${{ secrets.STAGING_KUBECONFIG == '' }}
        uses: helm/kind-action@v1.12.0
        with:
          node_image: kindest/node:v1.31.4
          cluster_name: rahbar-cd
      - name: Rollout and smoke test on ephemeral cluster
        if: ${{ secrets.STAGING_KUBECONFIG == '' }}
        run: |
          docker pull chromadb/chroma:1.0.12
          docker pull redis:7.4-alpine
          kind load docker-image chromadb/chroma:1.0.12 --name rahbar-cd
          kind load docker-image redis:7.4-alpine --name rahbar-cd
          docker build -t rahbar-api:${{ github.sha }} api/
          docker build -t rahbar-ui:${{ github.sha }} ui/
          docker build -f indexer/Dockerfile -t rahbar-indexer:${{ github.sha }} .
          kind load docker-image rahbar-api:${{ github.sha }} --name rahbar-cd
          kind load docker-image rahbar-ui:${{ github.sha }} --name rahbar-cd
          kind load docker-image rahbar-indexer:${{ github.sha }} --name rahbar-cd
          kubectl create namespace rahbar --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k k8s/overlays/dev
          kubectl set image deployment/api api="rahbar-api:${{ github.sha }}" -n rahbar
          kubectl set image deployment/ui ui="rahbar-ui:${{ github.sha }}" -n rahbar
          kubectl rollout status deployment/api -n rahbar --timeout=180s
          kubectl rollout status deployment/ui -n rahbar --timeout=180s
          kubectl port-forward service/api 8000:8000 -n rahbar >/dev/null 2>&1 &
          sleep 5
          curl --fail --silent http://127.0.0.1:8000/healthz
          kubectl get ingress -n rahbar
