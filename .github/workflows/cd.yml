name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RETRIEVER: stub
      LLM_PROVIDER: stub
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            indexer/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r indexer/requirements.txt
          python -m pip install -r api/requirements.txt
          python -m pip install -r requirements-dev.txt
      - run: pytest api/tests/ indexer/tests/ --cov=app --cov=pipeline --cov-report=term-missing --cov-fail-under=60
      - run: ruff check .
      - run: python -m compileall -q api indexer corpus

  build-push:
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish API image
        uses: docker/build-push-action@v6.15.0
        with:
          context: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
      - name: Build and publish indexer image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: indexer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
      - name: Build and publish UI image
        uses: docker/build-push-action@v6.15.0
        with:
          context: ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}

  deploy:
    needs: [build-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: azure/setup-kubectl@v4.0.0
        with:
          version: v1.31.4
      - uses: helm/kind-action@v1.12.0
        with:
          node_image: kindest/node:v1.31.4
          cluster_name: rahbar-cd
      - name: Deploy manifests to ephemeral cluster
        run: |
          docker pull chromadb/chroma:1.0.12
          docker pull redis:7.4-alpine
          kind load docker-image chromadb/chroma:1.0.12 --name rahbar-cd
          kind load docker-image redis:7.4-alpine --name rahbar-cd
          kubectl create namespace rahbar --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k k8s/overlays/dev
          kubectl set image deployment/api api=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} -n rahbar
          kubectl set image deployment/ui ui=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }} -n rahbar
      - name: Verify rollouts
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=180s
          kubectl rollout status deployment/ui -n rahbar --timeout=180s
      - name: Ingress smoke test
        run: |
          kubectl get ingress -n rahbar
          kubectl port-forward service/api 8000:8000 -n rahbar >/dev/null 2>&1 &
          sleep 5
          curl --fail --silent http://127.0.0.1:8000/healthz
          curl --fail --silent http://127.0.0.1:8000/readyz
