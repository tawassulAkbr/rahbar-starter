name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RETRIEVER: stub
      LLM_PROVIDER: stub
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            indexer/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r indexer/requirements.txt
          python -m pip install -r api/requirements.txt
          python -m pip install -r requirements-dev.txt
      - run: pytest api/tests/ indexer/tests/ --cov=app --cov=pipeline --cov-report=term-missing --cov-fail-under=60
      - run: ruff check .
      - run: python -m compileall -q api indexer corpus

  build-push:
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.10.0
      - name: Sanitize and validate Docker Hub credentials
        id: docker_creds
        env:
          RAW_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          RAW_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/sanitize_docker_creds.py
      - name: Log in to Docker Hub
        if: ${{ steps.docker_creds.outputs.can_publish == 'true' }}
        id: docker_login
        continue-on-error: true
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ steps.docker_creds.outputs.username }}
          password: ${{ steps.docker_creds.outputs.token }}
      - name: Report image publication mode
        id: pub_mode
        run: |
          if [ "${{ steps.docker_creds.outputs.can_publish }}" = "true" ] && [ "${{ steps.docker_login.outcome }}" = "success" ]; then
            echo "SHOULD_PUSH=true" >> "$GITHUB_OUTPUT"
            echo "Authenticated to Docker Hub as ${{ steps.docker_creds.outputs.username }}; images will be published."
          else
            echo "SHOULD_PUSH=false" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.docker_creds.outputs.can_publish }}" = "true" ]; then
              echo "::warning::Docker Hub login failed (verify DOCKERHUB_USERNAME is your Docker ID, not email, and DOCKERHUB_TOKEN is a valid PAT). Proceeding with local verification build without publishing."
            else
              echo "Docker Hub credentials are not configured; building without publishing."
            fi
          fi
      - name: Build and publish API image
        uses: docker/build-push-action@v6.15.0
        with:
          context: api
          platforms: linux/amd64
          push: ${{ steps.pub_mode.outputs.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.docker_creds.outputs.prefix }}/rahbar-api:${{ github.sha }}
      - name: Build and publish indexer image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: indexer/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.pub_mode.outputs.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.docker_creds.outputs.prefix }}/rahbar-indexer:${{ github.sha }}
      - name: Build and publish UI image
        uses: docker/build-push-action@v6.15.0
        with:
          context: ui
          platforms: linux/amd64
          push: ${{ steps.pub_mode.outputs.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.docker_creds.outputs.prefix }}/rahbar-ui:${{ github.sha }}

  deploy:
    needs: [build-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Determine image prefix
        id: docker_creds
        env:
          RAW_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          RAW_TOKEN: ""
        run: python3 scripts/sanitize_docker_creds.py
      - uses: azure/setup-kubectl@v4.0.0
        with:
          version: v1.31.4
      - uses: helm/kind-action@v1.12.0
        with:
          node_image: kindest/node:v1.31.4
          cluster_name: rahbar-cd
      - name: Build and load images into ephemeral Kind cluster
        env:
          PREFIX: ${{ steps.docker_creds.outputs.prefix }}
          SHA: ${{ github.sha }}
        run: |
          docker pull chromadb/chroma:1.0.12
          docker pull redis:7.4-alpine
          docker pull python:3.12.3-slim-bookworm
          docker pull busybox:1.36.1
          kind load docker-image chromadb/chroma:1.0.12 --name rahbar-cd
          kind load docker-image redis:7.4-alpine --name rahbar-cd
          kind load docker-image python:3.12.3-slim-bookworm --name rahbar-cd
          kind load docker-image busybox:1.36.1 --name rahbar-cd
          docker build -t "$PREFIX/rahbar-api:$SHA" api/
          docker build -t "$PREFIX/rahbar-ui:$SHA" ui/
          docker build -f indexer/Dockerfile -t "$PREFIX/rahbar-indexer:$SHA" .
          # The dev overlay resolves these images to the local :dev tags.
          # Keep the immutable SHA tags for provenance, and load matching
          # overlay tags so Kubernetes never attempts a registry pull.
          docker tag "$PREFIX/rahbar-api:$SHA" rahbar-api:dev
          docker tag "$PREFIX/rahbar-ui:$SHA" rahbar-ui:dev
          docker tag "$PREFIX/rahbar-indexer:$SHA" rahbar-indexer:dev
          kind load docker-image "$PREFIX/rahbar-api:$SHA" --name rahbar-cd
          kind load docker-image "$PREFIX/rahbar-ui:$SHA" --name rahbar-cd
          kind load docker-image "$PREFIX/rahbar-indexer:$SHA" --name rahbar-cd
          kind load docker-image rahbar-api:dev --name rahbar-cd
          kind load docker-image rahbar-ui:dev --name rahbar-cd
          kind load docker-image rahbar-indexer:dev --name rahbar-cd
      - name: Deploy manifests to cluster
        env:
          PREFIX: ${{ steps.docker_creds.outputs.prefix }}
          SHA: ${{ github.sha }}
        run: |
          kubectl create namespace rahbar --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap embedding-stub-code -n rahbar \
            --from-file=ci_embedding_stub.py=scripts/ci_embedding_stub.py \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap corpus-fixtures -n rahbar \
            --from-file=academic-rules-2023.md=eval/fixtures/academic-rules-2023.md \
            --from-file=academic-rules-2026.md=eval/fixtures/academic-rules-2026.md \
            --from-file=fees-2026.md=eval/fixtures/fees-2026.md \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k k8s/overlays/cd
          kubectl set image deployment/api api="$PREFIX/rahbar-api:$SHA" -n rahbar
          kubectl set image deployment/ui ui="$PREFIX/rahbar-ui:$SHA" -n rahbar
      - name: Verify rollouts
        run: |
          kubectl wait --for=condition=ready pod -l app=chroma -n rahbar --timeout=180s
          kubectl wait --for=condition=ready pod -l app=redis -n rahbar --timeout=120s
          kubectl wait --for=condition=complete job/indexer-job -n rahbar --timeout=600s
          kubectl rollout status deployment/api -n rahbar --timeout=180s
          kubectl rollout status deployment/ui -n rahbar --timeout=180s
      - name: Ingress smoke test
        run: |
          kubectl get ingress -n rahbar
          kubectl port-forward service/api 8000:8000 -n rahbar >/dev/null 2>&1 &
          sleep 5
          curl --fail --silent http://127.0.0.1:8000/healthz
          curl --fail --silent http://127.0.0.1:8000/readyz
